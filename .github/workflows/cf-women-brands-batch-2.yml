name: CF Women Brands Batch 2

# Automatically starts after "CF Women Brands Batch 1" completes on its
# SCHEDULED run (not when it is triggered manually).
# Can also be triggered manually; manual runs do NOT continue the chain.

on:
  workflow_run:
    workflows: ["CF Women Brands Batch 1"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: false

jobs:
  scrape:
    # Only start automatically when Batch 1 was itself a scheduled run AND
    # it succeeded.  Manual triggers of Batch 1 set event == 'workflow_dispatch',
    # so they will NOT start this job automatically.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        folder:
          - women_brands_sub86
          - women_brands_sub87
          - women_brands_sub88
          - women_brands_sub89
          - women_brands_sub90
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright beautifulsoup4 boto3 requests openpyxl

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run CF.${{ matrix.folder }}
        env:
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_ENDPOINT_URL: ${{ secrets.CF_R2_ENDPOINT_URL }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: python -m CF.${{ matrix.folder }}.main
